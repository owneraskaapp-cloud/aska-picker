<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- "origin": hanya asal situs (tanpa jalur/fragmen) yang dikirim ke Google, dibutuhkan agar API key dengan pembatasan situs diterima. Token ada di fragmen dan tidak pernah ikut terkirim. -->
<meta name="referrer" content="origin">
<title>ASKA · Pilih file atau folder bersama</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b0f14; color: #e8edf2; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { color: #a9b4c0; font-size: 14px; line-height: 1.5; }
  .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 14px; border-radius: 12px; border: 0;
         background: #d4a72c; color: #111; font-weight: 700; font-size: 15px; text-decoration: none; margin-top: 14px; cursor: pointer; }
  .btn.sec { background: transparent; color: #e8edf2; border: 1px solid #3a4652; }
  .err { background: #3a1518; color: #ffd7d7; padding: 12px; border-radius: 10px; font-size: 13.5px; }
  .ok { background: #12301f; color: #c9f5d9; padding: 12px; border-radius: 10px; font-size: 13.5px; }
  .hide { display: none; }
</style>
</head>
<body>
<!--
  ASKA Modul 34b: halaman pemilih file Google (Picker) untuk pasangan. Dibuka aplikasi lewat Chrome Custom Tab.
  Parameter dikirim lewat FRAGMEN (#), tidak pernah terkirim ke server hosting, dan langsung dihapus dari alamat.
    t = token akses Google (izin drive.file, ±1 jam)   k = API key Picker   p = Project number (appId)
    s = kode cocok sekali pakai dari aplikasi            a = nama paket aplikasi (untuk tautan balik)
    m = "folder" untuk memilih FOLDER foto nota bersama (default: pilih file spreadsheet)
  Halaman ini statis, tidak memuat skrip selain apis.google.com, dan tidak menyimpan apa pun.
-->
<main>
  <h1 id="head">Pilih file keuangan bersama</h1>
  <p id="lead">Memuat pemilih file Google…</p>
  <div id="msg" class="hide"></div>
  <a id="back" class="btn hide" href="#">Kembali ke ASKA</a>
  <button id="again" class="btn sec hide" type="button">Buka pemilih lagi</button>
</main>
<script>
(function () {
  var q = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  try { history.replaceState(null, '', location.pathname); } catch (e) {} // token tidak tertinggal di alamat/riwayat

  var TOKEN = q.t || '', KEY = q.k || '', APP_ID = q.p || '', STATE = q.s || '';
  var PKG = /^[a-zA-Z][\w.]{2,80}$/.test(q.a || '') ? q.a : 'id.aska.app.dev';
  var FOLDER = q.m === 'folder'; // mode folder: pasangan memilih folder "ASKA Nota" milik Owner
  var $ = function (id) { return document.getElementById(id); };

  function backUrl(params) {
    if (FOLDER) params.m = 'folder';
    var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return 'intent://picked?' + qs + '#Intent;scheme=aska;package=' + PKG + ';end';
  }
  function show(kind, text) { var m = $('msg'); m.className = kind; m.textContent = text; }
  function offerBack(params, auto) {
    var url = backUrl(params), b = $('back');
    b.href = url; b.className = 'btn';
    if (auto) setTimeout(function () { location.href = url; }, 300);
  }
  function fail(text) {
    $('lead').textContent = '';
    show('err', text + ' Jika Chrome meminta masuk, masuklah dengan akun Google yang SAMA dengan akun ASKA, lalu ketuk "Buka pemilih lagi".');
    $('again').className = 'btn sec';
    offerBack({ s: STATE, err: '1' }, false);
  }

  if (FOLDER) $('head').textContent = 'Pilih folder foto nota bersama';

  if (!TOKEN || !KEY || !/^\d+$/.test(APP_ID)) {
    $('lead').textContent = '';
    show('err', 'Halaman ini harus dibuka dari aplikasi ASKA (Pengaturan › Pasangan › Buka file bersama).');
    return;
  }

  function openPicker() {
    try {
      var shared, all;
      if (FOLDER) {
        shared = new google.picker.DocsView(google.picker.ViewId.FOLDERS).setOwnedByMe(false).setIncludeFolders(true).setSelectFolderEnabled(true)
          .setMimeTypes('application/vnd.google-apps.folder');
        all = new google.picker.DocsView(google.picker.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true)
          .setMimeTypes('application/vnd.google-apps.folder');
      } else {
        shared = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setOwnedByMe(false).setIncludeFolders(false);
        all = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setIncludeFolders(false);
      }
      new google.picker.PickerBuilder()
        .addView(shared).addView(all)
        .setOAuthToken(TOKEN).setDeveloperKey(KEY).setAppId(APP_ID)
        .setOrigin(location.protocol + '//' + location.host)
        .setTitle(FOLDER ? 'Pilih folder ASKA Nota dari pasangan' : 'Pilih file ASKA yang dibagikan pasangan')
        .setCallback(function (data) {
          if (data.action === google.picker.Action.PICKED) {
            var d = data.docs[0];
            $('lead').textContent = '';
            show('ok', 'Terpilih: ' + d.name + '. Kembali ke ASKA untuk menyelesaikan.');
            offerBack({ id: d.id, s: STATE }, true);
            $('again').className = 'btn sec';
          } else if (data.action === google.picker.Action.CANCEL) {
            $('lead').textContent = 'Pemilihan dibatalkan.';
            $('again').className = 'btn sec';
            offerBack({ s: STATE, cancel: '1' }, false);
          }
        }).build().setVisible(true);
      $('lead').textContent = FOLDER
        ? 'Pilih folder "ASKA Nota" yang dibagikan pasangan Anda (tab "Dibagikan kepada saya"), lalu ketuk Pilih.'
        : 'Pilih file keuangan yang dibagikan pasangan Anda (tab "Dibagikan kepada saya").';
    } catch (e) { fail('Pemilih file gagal dibuka (' + (e && e.message ? e.message : 'galat') + ').'); }
  }
  $('again').addEventListener('click', openPicker);

  window.onApiLoad = function () {
    gapi.load('picker', { callback: openPicker, onerror: function () { fail('Modul pemilih Google gagal dimuat.'); } });
  };
  var s = document.createElement('script');
  s.src = 'https://apis.google.com/js/api.js?onload=onApiLoad';
  s.onerror = function () { fail('Tidak bisa memuat apis.google.com. Periksa internet.'); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
